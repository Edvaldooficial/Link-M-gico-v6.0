<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link Mágico Chatbot IA</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>✨ Bem-vindo! Nova geração de assistente de vendas com respostas naturais e persuasivas.</h1>
  </header>

  <main>
    <section id="extractor">
      <label for="urlInput">🔗 URL da Página:</label>
      <input type="text" id="urlInput" placeholder="Cole a URL aqui..." />
      <button id="extractBtn">📊 Extrair Dados</button>
      <div id="extractedData"></div>
    </section>

    <section id="chat">
      <button id="activate-chatbot">🚀 Ativar Chatbot Inteligente ✅ Chat</button>
      <div id="chatWindow" class="hidden"></div>
      <input type="text" id="chatInput" placeholder="Digite sua mensagem..." />
      <button id="sendBtn">Enviar</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
